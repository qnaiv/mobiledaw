name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチに新しい push が来たら古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 1G

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: core-linux
      - name: Configure
        run: cmake -S core -B build -G "Unix Makefiles" -DMDAW_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Drum kit index is up to date
        run: python3 tools/kits/build_index.py --check

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # リリースに APK を置くため
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: app/android/app/build.gradle.kts
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter scaffolding
        run: scripts/bootstrap_app.sh
      - name: Analyze
        working-directory: app
        run: |
          code=0
          flutter analyze > "$RUNNER_TEMP/analyze.log" 2>&1 || code=$?
          cat "$RUNNER_TEMP/analyze.log"
          if [ "$code" -ne 0 ]; then
            {
              echo '## flutter analyze'
              echo '```'
              cat "$RUNNER_TEMP/analyze.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      - name: Dart tests
        working-directory: app
        run: |
          code=0
          flutter test > "$RUNNER_TEMP/test.log" 2>&1 || code=$?
          cat "$RUNNER_TEMP/test.log"
          if [ "$code" -ne 0 ]; then
            {
              echo '## flutter test'
              echo '```'
              tail -n 200 "$RUNNER_TEMP/test.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      # 署名鍵をシークレットから取り出す。毎回同じ鍵で署名するので、端末では上書きでインストールできる。
      # シークレットが無い（フォークなど）ときはデバッグ鍵で署名し、リリースは作らない。
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "署名鍵のシークレットが無いので、デバッグ鍵で署名します"
            exit 0
