analyzer:
  exclude:
    - build/**
    - android/**
  errors:
    # CI の新しい Flutter で material.dart 自体が deprecated 扱いになり
    # info が大量に出て analyze が落ちるため、当面この診断だけ無効化する。
    # ローカルの 3.47.9 では出ない診断。import 移行時に外すこと。
    deprecated_member_use: ignore
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_final_locals
    - unawaited_futures
