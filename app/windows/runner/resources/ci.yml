name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチに新しい push が来たら古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 1G

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ccache が入れられない（ランナーの apt が一時的に名前解決できない等）でも、
      # テスト自体は ccache なしで進める
      - uses: hendrikmuhs/ccache-action@v1.2
        continue-on-error: true
        with:
          key: core-linux
      - name: Configure
        run: cmake -S core -B build -G "Unix Makefiles" -DMDAW_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Drum kit index is up to date
        run: python3 tools/kits/build_index.py --check

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # リリースに APK を置くため
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: app/android/app/build.gradle.kts
      - uses: hendrikmuhs/ccache-action@v1.2
        continue-on-error: true
        with:
          key: android-arm64
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter scaffolding
        run: scripts/bootstrap_app.sh
      - name: Analyze
        working-directory: app
        run: |
          code=0
          flutter analyze > "$RUNNER_TEMP/analyze.log" 2>&1 || code=$?
          cat "$RUNNER_TEMP/analyze.log"
          if [ "$code" -ne 0 ]; then
            {
              echo '## flutter analyze'
              echo '```'
              cat "$RUNNER_TEMP/analyze.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      - name: Dart tests
        working-directory: app
        run: |
          code=0
          flutter test > "$RUNNER_TEMP/test.log" 2>&1 || code=$?
          cat "$RUNNER_TEMP/test.log"
          if [ "$code" -ne 0 ]; then
            {
              echo '## flutter test'
              echo '```'
              tail -n 200 "$RUNNER_TEMP/test.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      # 署名鍵をシークレットから取り出す。毎回同じ鍵で署名するので、端末では上書きでインストールできる。
      # シークレットが無い（フォークなど）ときはデバッグ鍵で署名し、リリースは作らない。
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "署名鍵のシークレットが無いので、デバッグ鍵で署名します"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "MDAW_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "MDAW_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MDAW_KEY_ALIAS=$KEY_ALIAS"
            echo "MDAW_KEY_PASSWORD=$KEY_PASSWORD"
            echo "MDAW_SIGNED=1"
          } >> "$GITHUB_ENV"
      # ビルド番号は Actions の実行番号（増え続ける）。アプリはこれで新しい版かどうかを判定する
      - name: Build APK
        working-directory: app
        run: >
          flutter build apk --release --target-platform android-arm64
          --build-number ${{ github.run_number }}
          --dart-define=MDAW_BUILD=${{ github.run_number }}
      - name: Publish release for in-app update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.MDAW_SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          cp app/build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/mobiledaw.apk"
          git log -1 --format=%B "${{ github.sha }}" | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" "$RUNNER_TEMP/mobiledaw.apk" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "build ${{ github.run_number }}" --notes-file "$RUNNER_TEMP/notes.md"
          # 古いリリースは新しい10件だけ残す
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName -q '.[].tagName' \
            | grep '^build-' | sort -t- -k2 -n -r | tail -n +11 \
            | xargs -r -I{} gh release delete {} --repo "${{ github.repository }}" --yes --cleanup-tag
      - uses: actions/upload-artifact@v4
        with:
          name: mobiledaw-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # Windows 版。ビルド確認は PR でも回し、main への push のときだけ
  # Android ジョブが作る build-<番号> リリースへ zip を添付する。
  # リリースは Android ジョブが作るので、添付ステップは出現を待ってから実行する
  # （並行ジョブ同士の順序は保証されないため）。署名シークレットが無い環境では
  # Android 側もリリースを作らないので、こちらも添付を省く。
  windows-exe:
    name: Windows EXE
    runs-on: windows-latest
    permissions:
      contents: write # リリースに zip を添付するため
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # リポジトリにある windows/（CMake・チャネル実装）は上書きされず、
      # 雛形の不足分だけ生成される（Android の bootstrap と同じ流儀）
      - name: Generate Flutter scaffolding
        working-directory: app
        run: flutter create --platforms=windows --org com.qnaiv --project-name mobiledaw .
      - name: Build Windows
        working-directory: app
        run: flutter build windows --release --dart-define=MDAW_BUILD=${{ github.run_number }}
      - name: Zip bundle
        shell: pwsh
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath "$env:RUNNER_TEMP/mobiledaw-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mobiledaw-windows
          path: app/build/windows/x64/runner/Release
          retention-days: 14
      - name: Attach zip to the build release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "署名鍵のシークレットが無い環境ではリリースが作られないので、添付を省きます"
            exit 0
          fi
          tag="build-${{ github.run_number }}"
          for i in $(seq 1 30); do
            if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
              break
            fi
            echo "リリース $tag を待っています ($i/30)"
            sleep 20
          done
          gh release upload "$tag" "$RUNNER_TEMP/mobiledaw-windows.zip" \
            --repo "${{ github.repository }}" --clobber
